name: Windows validation
on: [push, pull_request, workflow_dispatch]
jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -v
      - run: python -m compileall -q -x "results|\.git" .
  real-media:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install playwright
      - name: Real Commons images and browser decoding (no dummy fallback)
        id: live
        continue-on-error: true
        run: python live_smoke.py --run --browser --output results/windows-live
      - name: Record live test outcome separately
        shell: pwsh
        run: |
          "Real-media outcome: ${{ steps.live.outcome }}. This is separate from unit tests." >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-real-media-result
          path: results/windows-live
          retention-days: 7
      - name: Fail when real media was not verified
        if: steps.live.outcome != 'success'
        run: exit 1
